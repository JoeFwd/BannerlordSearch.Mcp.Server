workflow: GitHubFlow/v1
mode: ContinuousDeployment
next-version: 0.1.1
branches:
  main:
    increment: Patch
    prevent-increment:
      of-merged-branch: true
  feature:
    increment: Patch
  release:
    increment: Patch
  hotfix:
    increment: Patch
    regex: ^hotfix[\/\-](?<BranchName>.+)
ignore:
  sha: []
commit-message-incrementing: Enabled
major-version-bump-message: '^(\w+)(\(.+\))?!:|BREAKING[ -]CHANGE'
minor-version-bump-message: '^feat(\(.+\))?:'
patch-version-bump-message: '^fix(\(.+\))?:'
no-bump-message: '^(docs|style|test|ci|chore|build|refactor)(\(.+\))?:'
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
