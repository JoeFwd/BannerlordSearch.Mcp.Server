name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Debug GitVersion config
        run: |
          echo "=== GitVersion.yml ==="
          cat GitVersion.yml
          echo ""
          echo "=== Running GitVersion directly ==="
          dotnet-gitversion . /output json /l console 2>&1 || true

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Debug version outputs
        run: |
          echo "Step output nuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "--- All GitVersion env vars ---"
          env | grep -i gitversion || echo "(none found)"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        run: |
          dotnet pack BannerlordSearch.Presentation/BannerlordSearch.Presentation.csproj \
            -c Release \
            --no-build \
            --no-restore \
            -p:PackageVersion=$GitVersion_NuGetVersion \
            -o ./nupkg

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json
