name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Debug GitVersion config
        run: |
          echo "=== GitVersion.yml ==="
          cat GitVersion.yml
          echo ""
          echo "=== Running GitVersion directly ==="
          dotnet-gitversion . /output json /l console 2>&1 || true

      - name: Determine version
        id: gitversion
        run: |
          version="$(dotnet-gitversion . /showvariable SemVer)"
          echo "nuget_version=$version" >> "$GITHUB_OUTPUT"

      - name: Debug version outputs
        run: |
          echo "Package version: ${{ steps.gitversion.outputs.nuget_version }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        run: |
          dotnet pack BannerlordSearch.Presentation/BannerlordSearch.Presentation.csproj \
            -c Release \
            --no-build \
            --no-restore \
            -p:PackageVersion=${{ steps.gitversion.outputs.nuget_version }} \
            -o ./nupkg

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json

      - name: Update changelog
        if: github.ref == 'refs/heads/main'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.gitversion.outputs.nuget_version }} -o CHANGELOG.md

      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.gitversion.outputs.nuget_version }} --unreleased --strip all

      - name: Commit changelog
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs(changelog): update for v${{ steps.gitversion.outputs.nuget_version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag published release
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.gitversion.outputs.nuget_version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.nuget_version }}
          name: v${{ steps.gitversion.outputs.nuget_version }}
          body: ${{ steps.release_notes.outputs.content }}
          files: ./nupkg/*.nupkg
